name: Update news (daily)

# Daily news refresh: pulls top stories from authoritative outlets, scores
# and dedups them, writes data/news.json, commits back to main.

on:
  schedule:
    # 06:00 UTC every day — news.json is meant to be a morning snapshot.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-news
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      committed: ${{ steps.commit.outputs.committed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: update-scripts/requirements.txt

      - name: Install deps
        run: pip install -r update-scripts/requirements.txt

      - name: Fetch news
        run: python update-scripts/fetch_news.py

      - name: Commit updates
        id: commit
        run: |
          git config user.name  "daily-brief-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/news.json || true
          if git diff --cached --quiet; then
            echo "No news changes."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(news): refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Pages deploy
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main

name: Update news (6-hourly)

# News refresh every 6 hours: pulls top stories from authoritative outlets,
# scores and dedups them, writes data/news.json, commits back to main.

on:
  schedule:
    # 00:17, 06:17, 12:17, 18:17 UTC — off-peak minute avoids runner contention at :00.
    - cron: "17 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-news
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      committed: ${{ steps.commit.outputs.committed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: update-scripts/requirements.txt

      - name: Install deps
        run: pip install -r update-scripts/requirements.txt

      - name: Fetch news
        run: python update-scripts/fetch_news.py

      - name: Commit updates
        id: commit
        run: |
          git config user.name  "daily-brief-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/news.json || true
          if git diff --cached --quiet; then
            echo "No news changes."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(news): refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # Prices and news can race on push; retry with rebase a few times.
            for i in 1 2 3 4 5; do
              if git push; then
                echo "committed=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "push rejected (attempt $i); rebasing on origin/main"
              git pull --rebase origin main
            done
            echo "push failed after retries"
            exit 1
          fi

      - name: Trigger Pages deploy
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main
